<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title> 
    <link rel="stylesheet" type="text/css" href="css/styles.css">
    <link rel="stylesheet" type="text/css" href="css/contact.css">
</head>
<body>
    <nav class="navbar">
        <div class="links-container">
            <a class="nav-tag" href="/">Home</a>
            <a class="nav-tag" href="myProjects.html">My projects</a>
            <a class="nav-tag" href="workExp.html">Work experience</a>
            <a class="nav-tag" href="contact.html">Contact</a>                
        </div>
        <button type="button" class="open-sidebar-btn" onclick="openSidebar()">
            <svg xmlns="http://www.w3.org/2000/svg"  viewBox="0 -960 960 960" fill="white"><path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/></svg>
        </button>
    </nav>



<!--Sidebar is only for mobile screens-->

    <dialog id="sidebar-dialog">
        <div class="sidebar-container hideSidebar">

            <div class="sidebar-links-container">
                <a class="nav-tag close-sidebar-btn" onclick="closeSidebar()">
                <svg xmlns="http://www.w3.org/2000/svg" height="1.7rem" viewBox="0 -960 960 960" width="1.7rem" fill="#e3e3e3"><path d="M440-280v-400L240-480l200 200Zm80 160h80v-720h-80v720Z"/></svg>
                    Close</a>
                <a class="nav-tag" href="/">Home</a>
                <a class="nav-tag" href="myProjects.html">My projects</a>
                <a class="nav-tag" href="workExp.html">Work experience</a>
                <a class="nav-tag" href="contact.html">Contact</a>                
            </div>
        </div>
    </dialog>



    <div class="contact-container">
        <form class="contact-form" action="https://api.web3forms.com/submit" method="POST">
            <h1>Get in touch</h1>
            
            <input type="hidden" name="access_key" value="6e70c385-43fa-4e75-8091-7eb46e6dc121">

            <div>
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your name..." required>
            </div>

            <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Your email.." required>
            </div>

            <div>
                <label for="subject">Subject</label>
                <textarea id="subject" name="message" placeholder="Write something..." required></textarea>
            </div>

            <div>
                <input class="custom-btn" type="submit" value="Submit" onclick="submitForm()">
            </div>
        </form>
    </div>
    

    <script src="script.js"></script>
</body>
</html>
